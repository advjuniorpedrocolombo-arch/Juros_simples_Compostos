<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Calculadora Financeira</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;color:#111827}
.app{max-width:560px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid #d1d5db;border-radius:14px;padding:16px;margin-bottom:14px}
h1{text-align:center;font-size:24px;margin:8px 0 18px}
h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,select,input{width:100%;font-size:16px;border-radius:10px;padding:13px;box-sizing:border-box}
button{border:0;font-weight:bold}
.tipo{background:#e5e7eb;color:#111827}
.tipo.ativo{background:#111827;color:#fff}
label{font-weight:bold;display:block;margin:13px 0 6px}
input,select{border:1px solid #d1d5db;background:#fff}
.calcular{background:#111827;color:#fff;margin-top:16px}
.limpar{background:#e5e7eb;margin-top:8px}
.resultado{display:none;background:#ecfdf5;color:#065f46;border-radius:10px;padding:14px;margin-top:14px;line-height:1.5}
.erro{display:none;background:#fef2f2;color:#991b1b;border-radius:10px;padding:14px;margin-top:14px}
.formula{font-size:14px;color:#374151;margin-top:6px}
.obs{font-size:12px;color:#6b7280;text-align:center;line-height:1.4}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>Calculadora Financeira</h1>

<div class="card">
<h2>1. Escolha o tipo de juros</h2>
<div class="grid">
<button id="bSimples" class="tipo ativo" type="button">Juros Simples</button>
<button id="bComposto" class="tipo" type="button">Juros Compostos</button>
</div>
</div>

<div class="card">
<h2>2. O que deseja calcular?</h2>
<select id="objetivo">
<option value="juros">Juros</option>
<option value="montante">Montante</option>
<option value="capital">Capital</option>
<option value="taxa">Taxa</option>
<option value="tempo">Tempo</option>
</select>

<div id="campos"></div>

<button id="btnCalcular" class="calcular" type="button">CALCULAR</button>
<button id="btnLimpar" class="limpar" type="button">LIMPAR</button>

<div id="erro" class="erro"></div>
<div id="resultado" class="resultado"></div>
</div>

<div class="obs">
Para conversão de unidades, considera-se mês comercial de 30 dias e ano comercial de 360 dias.
</div>
</div>

<script>
(function(){
var tipo='simples';
var fator={dia:1,mes:30,ano:360};

function el(id){return document.getElementById(id)}

function valor(id){
  var e=el(id);
  if(!e) return null;
  var s=(e.value||'').trim().replace(',','.');
  if(s==='') return null;
  var n=parseFloat(s);
  return isNaN(n)?null:n;
}

function dinheiro(n){
  try{
    return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
  }catch(e){
    return 'R$ '+n.toFixed(2).replace('.',',');
  }
}

function numero(n,casas){
  casas=typeof casas==='number'?casas:6;
  return Number(n.toFixed(casas)).toString().replace('.',',');
}

function unidadeTaxaTexto(u){
  return u==='dia'?'ao dia':u==='mes'?'ao mês':'ao ano';
}

function unidadeTempoTexto(u,n){
  if(u==='dia') return Math.abs(n-1)<1e-10?'dia':'dias';
  if(u==='mes') return Math.abs(n-1)<1e-10?'mês':'meses';
  return Math.abs(n-1)<1e-10?'ano':'anos';
}

function campo(id,label,exemplo){
 return '<label for="'+id+'">'+label+'</label>'+
 '<input id="'+id+'" inputmode="decimal" type="text" placeholder="'+exemplo+'">';
}

function taxa(saida){
 return (saida?'':'<label>Taxa de juros (%)</label><input id="taxa" inputmode="decimal" type="text" placeholder="Ex.: 2">')+
 '<label>'+(saida?'Deseja a taxa':'Periodicidade da taxa')+'</label>'+
 '<select id="unTaxa"><option value="dia">ao dia</option><option value="mes" selected>ao mês</option><option value="ano">ao ano</option></select>';
}

function tempo(saida){
 return (saida?'':'<label>Tempo</label><input id="tempo" inputmode="decimal" type="text" placeholder="Ex.: 12">')+
 '<label>'+(saida?'Deseja o tempo em':'Unidade do tempo')+'</label>'+
 '<select id="unTempo"><option value="dia">dias</option><option value="mes" selected>meses</option><option value="ano">anos</option></select>';
}

function esconder(){
 el('erro').style.display='none';
 el('resultado').style.display='none';
}

function montar(){
 esconder();
 var o=el('objetivo').value;
 var h='';
 if(o==='juros'||o==='montante'){
   h=campo('capital','Capital (R$)','Ex.: 1000')+taxa(false)+tempo(false);
 }else if(o==='capital'){
   h= tipo==='simples'
      ? campo('juros','Juros (R$)','Ex.: 320')+taxa(false)+tempo(false)
      : campo('montante','Montante (R$)','Ex.: 1268,24')+taxa(false)+tempo(false);
 }else if(o==='taxa'){
   h=campo('capital','Capital (R$)','Ex.: 2000');
   h+= tipo==='simples'?campo('juros','Juros (R$)','Ex.: 320'):campo('montante','Montante (R$)','Ex.: 2500');
   h+=tempo(false)+taxa(true);
 }else if(o==='tempo'){
   h=campo('capital','Capital (R$)','Ex.: 2000');
   h+= tipo==='simples'?campo('juros','Juros (R$)','Ex.: 320'):campo('montante','Montante (R$)','Ex.: 2500');
   h+=taxa(false)+tempo(true);
 }
 el('campos').innerHTML=h;
}

function falha(msg){
 el('erro').innerHTML=msg;
 el('erro').style.display='block';
}

function sucesso(titulo,formula,extra){
 el('resultado').innerHTML='<strong>'+titulo+'</strong>'+
 (extra?'<div>'+extra+'</div>':'')+
 '<div class="formula">'+formula+'</div>';
 el('resultado').style.display='block';
}

function obrig(v,nome,zero){
 if(v===null) throw 'Informe '+nome+'.';
 if(zero ? v<0 : v<=0) throw nome+' deve ser '+(zero?'igual ou maior':'maior')+' que zero.';
}

function jurosSimplesTaxaNaUnidade(taxaPct,unTaxa,unTempo){
 return (taxaPct/100)/fator[unTaxa]*fator[unTempo];
}

function taxaCompostaEquivalente(taxaPct,unOrigem,unDestino){
 var r=taxaPct/100;
 return Math.pow(1+r,fator[unDestino]/fator[unOrigem])-1;
}

function calcular(){
 esconder();
 try{
  var o=el('objetivo').value;
  var C,J,M,t,r,ut,up,i,res;

  if(tipo==='simples'){
    if(o==='juros'||o==='montante'){
      C=valor('capital'); r=valor('taxa'); t=valor('tempo');
      obrig(C,'o capital',true); obrig(r,'a taxa',true); obrig(t,'o tempo',true);
      ut=el('unTaxa').value; up=el('unTempo').value;
      i=jurosSimplesTaxaNaUnidade(r,ut,up);
      J=C*i*t; M=C+J;
      if(o==='juros') sucesso('Juros: '+dinheiro(J),'J = C × i × t');
      else sucesso('Montante: '+dinheiro(M),'M = C + J','Juros: '+dinheiro(J));
    }
    else if(o==='capital'){
      J=valor('juros'); r=valor('taxa'); t=valor('tempo');
      obrig(J,'os juros',true); obrig(r,'a taxa'); obrig(t,'o tempo');
      i=jurosSimplesTaxaNaUnidade(r,el('unTaxa').value,el('unTempo').value);
      C=J/(i*t);
      sucesso('Capital: '+dinheiro(C),'C = J ÷ (i × t)');
    }
    else if(o==='taxa'){
      C=valor('capital'); J=valor('juros'); t=valor('tempo');
      obrig(C,'o capital'); obrig(J,'os juros',true); obrig(t,'o tempo');
      up=el('unTempo').value; ut=el('unTaxa').value;
      var iPeriodo=J/(C*t);
      var iDia=iPeriodo/fator[up];
      res=iDia*fator[ut]*100;
      sucesso('Taxa: '+numero(res,6)+'% '+unidadeTaxaTexto(ut),'i = J ÷ (C × t)');
    }
    else if(o==='tempo'){
      C=valor('capital'); J=valor('juros'); r=valor('taxa');
      obrig(C,'o capital'); obrig(J,'os juros',true); obrig(r,'a taxa');
      ut=el('unTaxa').value; up=el('unTempo').value;
      var taxaDia=(r/100)/fator[ut];
      var dias=J/(C*taxaDia);
      res=dias/fator[up];
      sucesso('Tempo: '+numero(res,4)+' '+unidadeTempoTexto(up,res),'t = J ÷ (C × i)');
    }
  }else{
    if(o==='juros'||o==='montante'){
      C=valor('capital'); r=valor('taxa'); t=valor('tempo');
      obrig(C,'o capital',true); obrig(r,'a taxa',true); obrig(t,'o tempo',true);
      ut=el('unTaxa').value; up=el('unTempo').value;
      i=taxaCompostaEquivalente(r,ut,up);
      M=C*Math.pow(1+i,t); J=M-C;
      if(o==='juros') sucesso('Juros: '+dinheiro(J),'J = C × (1 + i)^t − C','Montante: '+dinheiro(M));
      else sucesso('Montante: '+dinheiro(M),'M = C × (1 + i)^t','Juros: '+dinheiro(J));
    }
    else if(o==='capital'){
      M=valor('montante'); r=valor('taxa'); t=valor('tempo');
      obrig(M,'o montante',true); obrig(r,'a taxa',true); obrig(t,'o tempo',true);
      i=taxaCompostaEquivalente(r,el('unTaxa').value,el('unTempo').value);
      C=M/Math.pow(1+i,t);
      sucesso('Capital: '+dinheiro(C),'C = M ÷ (1 + i)^t');
    }
    else if(o==='taxa'){
      C=valor('capital'); M=valor('montante'); t=valor('tempo');
      obrig(C,'o capital'); obrig(M,'o montante'); obrig(t,'o tempo');
      up=el('unTempo').value; ut=el('unTaxa').value;
      var taxaTempo=Math.pow(M/C,1/t)-1;
      res=(Math.pow(1+taxaTempo,fator[ut]/fator[up])-1)*100;
      sucesso('Taxa: '+numero(res,6)+'% '+unidadeTaxaTexto(ut),'i = (M ÷ C)^(1/t) − 1');
    }
    else if(o==='tempo'){
      C=valor('capital'); M=valor('montante'); r=valor('taxa');
      obrig(C,'o capital'); obrig(M,'o montante'); obrig(r,'a taxa');
      ut=el('unTaxa').value; up=el('unTempo').value;
      i=taxaCompostaEquivalente(r,ut,up);
      if(i===0) throw 'Com taxa zero, não é possível determinar esse prazo.';
      res=Math.log(M/C)/Math.log(1+i);
      if(!isFinite(res)||res<0) throw 'Os valores informados não geram um prazo válido.';
      sucesso('Tempo: '+numero(res,4)+' '+unidadeTempoTexto(up,res),'t = ln(M ÷ C) ÷ ln(1 + i)');
    }
  }
 }catch(e){falha(String(e))}
}

el('bSimples').onclick=function(){
 tipo='simples'; this.className='tipo ativo'; el('bComposto').className='tipo'; montar();
};
el('bComposto').onclick=function(){
 tipo='composto'; this.className='tipo ativo'; el('bSimples').className='tipo'; montar();
};
el('objetivo').onchange=montar;
el('btnCalcular').onclick=calcular;
el('btnLimpar').onclick=montar;

montar();
})();
</script>
</body>
</html>
